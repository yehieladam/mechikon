<head><meta charset="utf-8"><title>inline composer fixture</title>
<style>
  body { font-family: Arial, sans-serif; padding: 40px; }
  .composer {
    min-height: 160px; width: 720px; border: 1px solid #ccc; border-radius: 12px;
    padding: 16px; font-size: 16px; line-height: 1.6; outline: none;

</body>
